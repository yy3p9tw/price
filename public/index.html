<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>產品價格查詢</title>
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;900&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="sticky-head">
  <div class="topbar">
    <h1>產品價格查詢</h1>
    <nav>
      <span class="muted-link" id="globalHistoryBtn">價格異動歷史</span>
    </nav>
  </div>
</div>

<div class="container">
  <nav class="quick-nav" id="quickNav"></nav>

  <div class="toolbar">
    <input type="text" id="search" class="search-input" placeholder="搜尋產品名稱或規格…">
  </div>

  <div id="productList"></div>
</div>

<!-- 全站價格異動歷史 modal -->
<div class="modal-backdrop" id="globalHistoryModal" hidden>
  <div class="modal modal-wide">
    <h2>價格異動歷史（全部產品）</h2>
    <div class="table-scroll">
      <table>
        <thead><tr><th>日期</th><th>產品</th><th>規格</th><th>動作</th><th>價格</th></tr></thead>
        <tbody id="globalHistoryBody"></tbody>
      </table>
    </div>
    <div class="form-actions">
      <button class="btn-secondary" id="globalHistoryCloseBtn">關閉</button>
    </div>
  </div>
</div>

<button class="back-to-top" id="backToTop" hidden title="回到頂部">↑</button>

<script type="module" src="js/app.js"></script>
</body>
</html>
