<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>後台管理 - 產品價格</title>
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;900&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="sticky-head">
  <div class="topbar">
    <h1>後台管理</h1>
    <nav>
      <span class="muted-link" id="globalHistoryBtn">價格異動歷史</span>
      <span class="muted-link" id="logoutBtn" hidden>登出</span>
      <a href="index.html">← 回到前台查詢</a>
    </nav>
  </div>
</div>

<div class="container">

  <div class="card" id="loginCard">
    <div class="card-head">
      <div class="product-name" style="font-size:14px;">後台登入</div>
    </div>
    <div class="form-row">
      <label>Email</label>
      <input type="email" id="loginEmail">
    </div>
    <div class="form-row">
      <label>密碼</label>
      <input type="password" id="loginPassword">
    </div>
    <div class="note" id="loginError"></div>
    <div class="form-actions" style="justify-content:flex-start;">
      <button class="btn-primary" id="loginBtn">登入</button>
    </div>
  </div>

  <div id="adminArea" hidden>
    <div class="card">
      <div class="card-head">
        <div class="product-name" style="font-size:14px;">分類管理</div>
      </div>
      <div class="category-list" id="categoryList"></div>
      <div class="spec-add-row">
        <input type="text" id="newCategoryName" placeholder="新增分類名稱…">
        <button class="btn-primary btn-sm" id="addCategoryBtn">新增分類</button>
      </div>
    </div>

    <div class="toolbar">
      <input type="text" id="search" class="search-input" placeholder="搜尋產品名稱或規格…">
      <select id="categoryFilter">
        <option value="">全部分類</option>
      </select>
      <button class="btn-primary" id="addProductBtn">＋ 新增產品</button>
    </div>

    <div id="productList"></div>
  </div>
</div>

<!-- 產品新增/編輯 modal -->
<div class="modal-backdrop" id="productModal" hidden>
  <div class="modal">
    <h2 id="productModalTitle">新增產品</h2>
    <input type="hidden" id="productId">
    <div class="form-row">
      <label>產品名稱</label>
      <input type="text" id="productName">
    </div>
    <div class="form-row">
      <label>分類</label>
      <select id="productCategory"><option value="">（無分類）</option></select>
    </div>
    <div class="form-row">
      <label>備註</label>
      <textarea id="productNote" rows="2"></textarea>
    </div>
    <div class="form-actions">
      <button class="btn-secondary" id="productCancelBtn">取消</button>
      <button class="btn-primary" id="productSaveBtn">儲存</button>
    </div>
  </div>
</div>

<!-- 規格編輯 modal -->
<div class="modal-backdrop" id="specModal" hidden>
  <div class="modal">
    <h2>編輯規格</h2>
    <input type="hidden" id="specId">
    <div class="form-row">
      <label>規格名稱</label>
      <input type="text" id="specName">
    </div>
    <div class="form-row">
      <label>價格</label>
      <input type="number" id="specPrice" min="0" step="0.01" placeholder="未定留空，前台顯示 --">
    </div>
    <div class="form-actions">
      <button class="btn-secondary" id="specCancelBtn">取消</button>
      <button class="btn-primary" id="specSaveBtn">儲存</button>
    </div>
  </div>
</div>

<!-- 價格歷史 modal -->
<div class="modal-backdrop" id="historyModal" hidden>
  <div class="modal">
    <h2>價格異動歷史</h2>
    <ul class="history-list" id="historyList"></ul>
    <div class="form-actions">
      <button class="btn-secondary" id="historyCloseBtn">關閉</button>
    </div>
  </div>
</div>

<!-- 全站價格異動歷史 modal -->
<div class="modal-backdrop" id="globalHistoryModal" hidden>
  <div class="modal modal-wide">
    <h2>價格異動歷史（全部產品）</h2>
    <div class="table-scroll">
      <table>
        <thead><tr><th>日期</th><th>產品</th><th>規格</th><th>動作</th><th>價格</th></tr></thead>
        <tbody id="globalHistoryBody"></tbody>
      </table>
    </div>
    <div class="form-actions">
      <button class="btn-secondary" id="globalHistoryCloseBtn">關閉</button>
    </div>
  </div>
</div>

<button class="back-to-top" id="backToTop" hidden title="回到頂部">↑</button>

<script type="module" src="js/admin.js"></script>
</body>
</html>
